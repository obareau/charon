name: tests

# Le multiplateforme se prouve, il ne se déclare pas : la suite tourne sur les
# trois systèmes cibles. Les tests n'importent jamais Qt — ils s'exécutent donc
# sans écran, et le test MIDI s'ignore là où aucun port de bouclage n'existe.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # python-rtmidi se lie a ALSA sur Linux ; sans ces en-tetes, une
      # construction depuis les sources echoue la ou aucune roue n'existe.
      - name: Dépendances ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Suite de tests
        run: uv run --python ${{ matrix.python }} --with pytest pytest tests/ -v

      - name: Le noyau s'importe sans Qt ni écran
        run: uv run --python ${{ matrix.python }} python -c "from charon.sysex import build_bank, voices; from charon.midi import output_ports; print('ports:', output_ports())"
